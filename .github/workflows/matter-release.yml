name: Matter SDK

on:
  push:
    branches: [matter/main]
    tags: ['matter-*']
  pull_request:
    branches: [matter/main]

permissions:
  contents: read

concurrency:
  group: matter-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'zeakd/pi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Select release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/matter-* ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/matter/main
            tag="$GITHUB_REF_NAME"
          else
            version="$(node -p "JSON.parse(require('fs').readFileSync('packages/coding-agent/package.json')).version")"
            tag="matter-${version}-1"
          fi
          echo "MATTER_PI_TAG=$tag" >> "$GITHUB_ENV"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -s /usr/bin/fdfind /usr/local/bin/fd
      - run: npm ci --ignore-scripts
      - run: node scripts/matter-model-data.mjs
      - run: npm run build:offline
      - run: npm run check
      - run: node --test scripts/matter-release.test.mjs
      - run: ./test.sh
      - name: Pack SDK release
        run: node scripts/matter-release.mjs "$MATTER_PI_TAG" .artifacts/matter-release
      - name: Verify packed consumers
        run: node scripts/verify-matter-release.mjs .artifacts/matter-release
      - name: Check source tree
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/matter-')
        with:
          name: matter-sdk
          path: .artifacts/matter-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/matter-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: matter-sdk
          path: release-assets
      - name: Publish verified assets
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          node -e 'const m=require("./manifest.json"); if(m.tag!==process.env.RELEASE_TAG || m.sourceSha!==process.env.GITHUB_SHA) throw Error("Release identity mismatch")'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect it before recovery. Existing assets are never overwritten."
            exit 1
          fi
          node -e 'const m=require("./manifest.json"); console.log(`Matter SDK ${m.version}\n\nUpstream: ${m.upstreamVersion}\nSource: ${m.sourceSha}\n\nUse consumer.json for dependency URLs. SHA256SUMS covers the package set and build catalog. This SDK distribution uses the consumer lockfile; npm registry publication is not part of this release.`)' > RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md ./*.tgz model-data.tar.gz manifest.json consumer.json SHA256SUMS
          expected="$(find . -maxdepth 1 -type f ! -name RELEASE_NOTES.md -printf '%f\n' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual"
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name, draft, immutable, assets: [.assets[].name]}'
